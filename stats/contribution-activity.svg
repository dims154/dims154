<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1100"
     height="500"
     viewBox="0 0 1100 500">

  <defs>

    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#050000"/>
      <stop offset="50%" stop-color="#180006"/>
      <stop offset="100%" stop-color="#020000"/>
    </linearGradient>

    <linearGradient id="redLine"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#ff003c"/>
      <stop offset="50%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>

    <filter id="glow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32"
            fill="none"
            stroke="#ff003c"
            stroke-opacity="0.10"
            stroke-width="1"/>
    </pattern>

    <pattern id="smallGrid"
             width="8"
             height="8"
             patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8"
            fill="none"
            stroke="#ff003c"
            stroke-opacity="0.035"
            stroke-width="1"/>
    </pattern>

    <style>
      .title {
        font-family: 'Courier New', monospace;
        font-weight: bold;
      }

      .mono {
        font-family: 'Courier New', monospace;
      }

      .red {
        fill: #ff1744;
      }

      .white {
        fill: #f5f5f5;
      }

      .muted {
        fill: #a37b84;
      }

      .number {
        fill: #ff1744;
        font-weight: bold;
      }

      .card {
        fill: #090306;
        stroke: #ff1744;
        stroke-opacity: 0.22;
        stroke-width: 1;
      }

      .cardGlow {
        fill: none;
        stroke: #ff1744;
        stroke-opacity: 0.08;
        stroke-width: 4;
        filter: url(#softGlow);
        animation: glow 2.8s ease-in-out infinite;
      }

      .bar {
        transform-box: fill-box;
        transform-origin: left center;
        animation: barGlow 2.4s ease-in-out infinite;
      }

      @keyframes barGlow {
        0%, 100% {
          opacity: 0.72;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.35;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes glow {
        0%, 100% {
          opacity: 0.55;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes scan {
        0% {
          transform: translateY(-150px);
          opacity: 0;
        }

        15% {
          opacity: 0.35;
        }

        50% {
          opacity: 0.12;
        }

        100% {
          transform: translateY(600px);
          opacity: 0;
        }
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -100;
        }
      }

      @keyframes blink {
        0%, 45% {
          opacity: 1;
        }

        50%, 100% {
          opacity: 0.25;
        }
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .glow {
        animation: glow 2.5s ease-in-out infinite;
      }

      .scan {
        animation: scan 5s linear infinite;
      }

      .dash {
        stroke-dasharray: 8 8;
        animation: dash 2s linear infinite;
      }

      .blink {
        animation: blink 1.5s step-end infinite;
      }
    </style>

  </defs>

