<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="330"
     viewBox="0 0 1000 330">

  <defs>

    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#050000"/>
      <stop offset="50%" stop-color="#180006"/>
      <stop offset="100%" stop-color="#020000"/>
    </linearGradient>

    <linearGradient id="redLine"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#ff003c"/>
      <stop offset="50%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>

    <filter id="glow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32"
            fill="none"
            stroke="#ff003c"
            stroke-opacity="0.10"
            stroke-width="1"/>
    </pattern>

    <pattern id="smallGrid"
             width="8"
             height="8"
             patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8"
            fill="none"
            stroke="#ff003c"
            stroke-opacity="0.035"
            stroke-width="1"/>
    </pattern>

    <style>
      .title {
        font-family: 'Courier New', monospace;
        font-weight: bold;
      }

      .mono {
        font-family: 'Courier New', monospace;
      }

      .red {
        fill: #ff1744;
      }

      .white {
        fill: #f5f5f5;
      }

      .muted {
        fill: #a37b84;
      }

      .number {
        fill: #ff1744;
        font-weight: bold;
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.35;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes glow {
        0%, 100% {
          opacity: 0.55;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes scan {
        0% {
          transform: translateY(-150px);
          opacity: 0;
        }

        15% {
          opacity: 0.35;
        }

        50% {
          opacity: 0.12;
        }

        100% {
          transform: translateY(600px);
          opacity: 0;
        }
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -100;
        }
      }

      @keyframes blink {
        0%, 45% {
          opacity: 1;
        }

        50%, 100% {
          opacity: 0.25;
        }
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .glow {
        animation: glow 2.5s ease-in-out infinite;
      }

      .scan {
        animation: scan 5s linear infinite;
      }

      .dash {
        stroke-dasharray: 8 8;
        animation: dash 2s linear infinite;
      }

      .blink {
        animation: blink 1.5s step-end infinite;
      }
    </style>

  </defs>

  <rect width="100%"
        height="100%"
        rx="14"
        fill="url(#bg)"/>

  <rect width="100%"
        height="100%"
        rx="14"
        fill="url(#smallGrid)"/>

  <rect width="100%"
        height="100%"
        rx="14"
        fill="url(#grid)"/>

  <rect x="4" y="4"
        width="992"
        height="322"
        rx="12"
        fill="none"
        stroke="#ff003c"
        stroke-width="5"
        opacity="0.15"
        filter="url(#softGlow)"
        class="glow"/>

  <rect x="6" y="6"
        width="988"
        height="318"
        rx="12"
        fill="none"
        stroke="url(#redLine)"
        stroke-width="1.5"
        filter="url(#glow)"/>

  <rect x="10" y="10"
        width="980"
        height="2"
        fill="#ff1744"
        opacity="0.2"
        class="scan"/>

  
  <text x="55" y="55"
        class="title red"
        font-size="24"
        letter-spacing="1">
    GITHUB STATISTICS
  </text>

  <text x="55" y="80"
        class="mono muted"
        font-size="10">
    LIVE PROFILE DATA / DIMS154
  </text>

  <line x1="55" y1="98"
        x2="945" y2="98"
        stroke="#ff1744"
        stroke-opacity="0.25"/>

  <text x="75" y="145"
        class="mono muted"
        font-size="11">
    CONTRIBUTIONS
  </text>

  <text x="75" y="190"
        class="number"
        font-size="38">
    98
  </text>

  <text x="335" y="145"
        class="mono muted"
        font-size="11">
    REPOSITORIES
  </text>

  <text x="335" y="190"
        class="number"
        font-size="38">
    8
  </text>

  <text x="595" y="145"
        class="mono muted"
        font-size="11">
    FOLLOWERS
  </text>

  <text x="595" y="190"
        class="number"
        font-size="38">
    2
  </text>

  <text x="75" y="235"
        class="mono muted"
        font-size="10">
    CURRENT STREAK
  </text>

  <text x="75" y="275"
        class="number"
        font-size="27">
    1 DAYS
  </text>

  <text x="335" y="235"
        class="mono muted"
        font-size="10">
    LONGEST STREAK
  </text>

  <text x="335" y="275"
        class="number"
        font-size="27">
    6 DAYS
  </text>

  <text x="595" y="235"
        class="mono muted"
        font-size="10">
    STATUS
  </text>

  <circle cx="605" cy="262"
          r="5"
          fill="#ff1744"
          filter="url(#glow)"
          class="pulse"/>

  <text x="620" y="267"
        class="mono red"
        font-size="12">
    ACTIVE
  </text>

  <text x="55" y="305"
        class="mono muted"
        font-size="9">
    AUTOMATICALLY GENERATED WITH GITHUB ACTIONS
  </text>


</svg>
