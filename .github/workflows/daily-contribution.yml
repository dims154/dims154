name: Daily Contribution Heartbeat

on:
  schedule:
    # Setiap hari pukul 01:30 UTC ≈ 08:30 WIB
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-contribution
  cancel-in-progress: false

jobs:
  heartbeat:
    name: Keep contribution graph active
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate daily contribution
        run: |
          set -euo pipefail

          mkdir -p .github

          DATE_UTC=$(date -u +"%Y-%m-%d")
          TIME_UTC=$(date -u +"%H:%M:%S")
          DAY_NAME=$(date -u +"%A")

          # Jumlah commit random 1–3 biar terlihat natural
          COMMITS=$(( (RANDOM % 3) + 1 ))

          LOG_FILE=".github/contribution-log.md"

          # Buat header log jika belum ada
          if [ ! -f "$LOG_FILE" ]; then
            cat > "$LOG_FILE" << 'HEADER'
          # Contribution Heartbeat Log

          Log otomatis untuk menjaga GitHub contribution graph tetap aktif.

          | Date (UTC) | Day | Time | Commits | Note |
          |------------|-----|------|---------|------|
          HEADER
            # Bersihkan indentasi dari heredoc
            sed -i 's/^          //' "$LOG_FILE"
          fi

          for i in $(seq 1 $COMMITS); do
            echo "| $DATE_UTC | $DAY_NAME | $TIME_UTC | $i/$COMMITS | heartbeat |" >> "$LOG_FILE"

            # File kecil supaya selalu ada perubahan
            echo "$DATE_UTC $TIME_UTC commit-$i" >> .github/.heartbeat

            git config user.name "dims154"
            git config user.email "dims154@users.noreply.github.com"

            git add .github/contribution-log.md .github/.heartbeat
            git commit -m "chore: daily heartbeat ($DATE_UTC) [$i/$COMMITS]"

            if [ "$i" -lt "$COMMITS" ]; then
              sleep 2
            fi
          done

          # Batasi ukuran log (header + ~150 baris terakhir)
          {
            head -n 6 "$LOG_FILE"
            tail -n 150 "$LOG_FILE" | grep -E '^\|' || true
          } > "$LOG_FILE.tmp"
          mv "$LOG_FILE.tmp" "$LOG_FILE"

          git add .github/contribution-log.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: trim contribution log"
          fi

          git push
