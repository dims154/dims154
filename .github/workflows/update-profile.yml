name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:

  update-profile:

    name: Generate Profile Statistics

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api graphql \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  login
                  followers { totalCount }
                  repositories(ownerAffiliations: OWNER first: 100 privacy: PUBLIC) {
                    totalCount
                    nodes {
                      name
                      languages(first: 20 orderBy: { field: SIZE direction: DESC }) {
                        edges { size node { name } }
                      }
                    }
                  }
                  contributionsCollection {
                    totalCommitContributions
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays { date contributionCount }
                      }
                    }
                  }
                }
              }' \
            -f login="dims154" \
            > github-data.json

          python3 - <<'PY'
          import json
          with open("github-data.json", encoding="utf-8") as f:
              data = json.load(f)
          if data.get("errors"):
              for e in data["errors"]:
                  print(e)
              raise SystemExit(1)
          if not data.get("data", {}).get("user"):
              raise SystemExit("GitHub user 'dims154' was not found.")
          print("GitHub data fetched successfully.")
          PY

      - name: Generate profile statistics
        run: |
          set -euo pipefail
          rm -rf generated-stats
          mkdir -p generated-stats stats

          python3 - <<'PY'
          import json, html
          from collections import defaultdict
          from pathlib import Path
          from datetime import datetime

          OUT = Path("generated-stats")

          with open("github-data.json", encoding="utf-8") as f:
              payload = json.load(f)

          user = payload["data"]["user"]
          repos = user["repositories"]
          collection = user["contributionsCollection"]
          calendar = collection["contributionCalendar"]

          repositories = int(repos["totalCount"])
          followers = int(user["followers"]["totalCount"])
          total_contributions = int(calendar["totalContributions"])
          commits = int(collection["totalCommitContributions"])

          days = []
          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({"date": day["date"], "count": int(day["contributionCount"])})
          days.sort(key=lambda x: x["date"])
          activity = days[-31:]

          current_streak = 0
          for day in reversed(days):
              if day["count"] > 0:
                  current_streak += 1
              else:
                  break

          longest_streak = 0
          running = 0
          for day in days:
              if day["count"] > 0:
                  running += 1
                  longest_streak = max(longest_streak, running)
              else:
                  running = 0

          language_totals = defaultdict(int)
          for repo in repos["nodes"]:
              if not repo:
                  continue
              for edge in (repo.get("languages") or {}).get("edges", []):
                  if edge and edge.get("node") and edge["node"].get("name"):
                      language_totals[edge["node"]["name"]] += int(edge.get("size") or 0)

          top_languages = sorted(language_totals.items(), key=lambda x: x[1], reverse=True)[:6]
          total_language_size = sum(language_totals.values()) or 1

          def esc(v):
              return html.escape(str(v))

          def card(title, lines, w=480, h=180):
              body = f'<rect width="{w}" height="{h}" rx="12" fill="#0d1117" stroke="#30363d"/>'
              body += f'<text x="20" y="32" fill="#ff1744" font-family="monospace" font-size="14" font-weight="bold">{esc(title)}</text>'
              y = 60
              for label, value in lines:
                  body += f'<text x="20" y="{y}" fill="#8b949e" font-family="monospace" font-size="12">{esc(label)}</text>'
                  body += f'<text x="{w-20}" y="{y}" fill="#c9d1d9" font-family="monospace" font-size="12" text-anchor="end">{esc(value)}</text>'
                  y += 28
              return f'<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="{w}" height="{h}" viewBox="0 0 {w} {h}">{body}</svg>\n'

          (OUT / "github-stats.svg").write_text(card("GITHUB STATS", [
              ("Repositories", repositories),
              ("Followers", followers),
              ("Total contributions", total_contributions),
              ("Commit contributions", commits),
          ]), encoding="utf-8")

          lang_lines = []
          for name, size in top_languages:
              pct = round(size / total_language_size * 100, 1)
              lang_lines.append((name, f"{pct}%"))
          if not lang_lines:
              lang_lines = [("No data", "-")]
          (OUT / "top-languages.svg").write_text(card("TOP LANGUAGES", lang_lines), encoding="utf-8")

          (OUT / "streak.svg").write_text(card("STREAK", [
              ("Current streak", f"{current_streak} days"),
              ("Longest streak", f"{longest_streak} days"),
          ], h=140), encoding="utf-8")

          # ========== LINE CHART: Contribution activity (last 31 days) ==========
          n = len(activity)
          total_act = sum(d["count"] for d in activity)
          max_c = max((d["count"] for d in activity), default=1) or 1

          W, H = 900, 280
          PAD_L, PAD_R, PAD_T, PAD_B = 48, 24, 56, 44
          chart_w = W - PAD_L - PAD_R
          chart_h = H - PAD_T - PAD_B

          def x_at(i):
              if n <= 1:
                  return PAD_L + chart_w / 2
              return PAD_L + (i / (n - 1)) * chart_w

          def y_at(count):
              # 0 at bottom, max at top
              return PAD_T + chart_h - (count / max_c) * chart_h

          points = [(x_at(i), y_at(d["count"])) for i, d in enumerate(activity)]

          # Polyline path
          line_pts = " ".join(f"{x:.1f},{y:.1f}" for x, y in points)

          # Area fill path (close to baseline)
          area_pts = (
              f"{points[0][0]:.1f},{PAD_T + chart_h:.1f} "
              + line_pts
              + f" {points[-1][0]:.1f},{PAD_T + chart_h:.1f}"
          )

          body = []
          body.append(f'<rect width="{W}" height="{H}" rx="14" fill="#0d1117" stroke="#30363d"/>')

          # Title
          body.append('<text x="24" y="28" fill="#ff1744" font-family="monospace" font-size="14" font-weight="bold">CONTRIBUTION ACTIVITY</text>')
          body.append(f'<text x="24" y="46" fill="#8b949e" font-family="monospace" font-size="10">LAST 31 DAYS · TOTAL {total_act} CONTRIBUTIONS</text>')

          # Horizontal grid lines
          for frac in (0.0, 0.25, 0.5, 0.75, 1.0):
              gy = PAD_T + chart_h * (1 - frac)
              body.append(f'<line x1="{PAD_L}" y1="{gy:.1f}" x2="{W - PAD_R}" y2="{gy:.1f}" stroke="#21262d" stroke-width="1"/>')
              val = int(round(max_c * frac))
              body.append(f'<text x="{PAD_L - 8}" y="{gy + 3:.1f}" fill="#6e7681" font-family="monospace" font-size="9" text-anchor="end">{val}</text>')

          # Area under line
          body.append(
              f'<polygon points="{area_pts}" fill="#ff1744" fill-opacity="0.12"/>'
          )

          # Line
          body.append(
              f'<polyline points="{line_pts}" fill="none" stroke="#ff1744" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'
          )

          # Dots on each day
          for i, (x, y) in enumerate(points):
              c = activity[i]["count"]
              r = 3.5 if c > 0 else 2.5
              fill = "#ff1744" if c > 0 else "#30363d"
              body.append(f'<circle cx="{x:.1f}" cy="{y:.1f}" r="{r}" fill="{fill}"/>')

          # X-axis labels (every ~5 days)
          step = max(1, n // 6)
          for i in range(0, n, step):
              d = activity[i]["date"]  # YYYY-MM-DD
              label = d[5:]  # MM-DD
              x = x_at(i)
              body.append(f'<text x="{x:.1f}" y="{H - 16}" fill="#6e7681" font-family="monospace" font-size="9" text-anchor="middle">{label}</text>')

          # Footer
          body.append(
              f'<text x="24" y="{H - 6}" fill="#484f58" font-family="monospace" font-size="8">Auto-updated · {datetime.utcnow().strftime("%Y-%m-%d %H:%M")} UTC</text>'
          )

          svg = (
              '<?xml version="1.0" encoding="UTF-8"?>'
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}">'
              + "".join(body)
              + "</svg>\n"
          )
          (OUT / "contribution-activity.svg").write_text(svg, encoding="utf-8")

          print("Generated all stats SVGs (line chart)")
          PY

      - name: Publish statistics
        run: |
          set -euo pipefail
          mkdir -p stats
          cp generated-stats/github-stats.svg stats/
          cp generated-stats/top-languages.svg stats/
          cp generated-stats/streak.svg stats/
          cp generated-stats/contribution-activity.svg stats/

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name "dims154"
          git config user.email "dims154@users.noreply.github.com"
          git add stats/github-stats.svg stats/top-languages.svg stats/streak.svg stats/contribution-activity.svg
          if git diff --cached --quiet; then
            echo "No statistics changes detected."
            exit 0
          fi
          git commit -m "chore: update profile statistics"
          git push
