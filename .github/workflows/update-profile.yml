      # ============================================================
      # VALIDATE GENERATED FILES
      # ============================================================

      - name: Validate generated files

        run: |

          set -euo pipefail

          for file in \
            github-stats.svg \
            top-languages.svg \
            streak.svg \
            contribution-activity.svg

          do

            test -s \
              "generated-stats/$file"

            grep -q \
              "<svg" \
              "generated-stats/$file"

            grep -q \
              "</svg>" \
              "generated-stats/$file"

            echo \
              "Validated: $file"

          done


      # ============================================================
      # PUBLISH STATISTICS
      # ============================================================

      - name: Publish statistics

        run: |

          set -euo pipefail

          cp \
            generated-stats/github-stats.svg \
            stats/github-stats.svg

          cp \
            generated-stats/top-languages.svg \
            stats/top-languages.svg

          cp \
            generated-stats/streak.svg \
            stats/streak.svg

          cp \
            generated-stats/contribution-activity.svg \
            stats/contribution-activity.svg


      # ============================================================
      # COMMIT CHANGES
      # ============================================================

      - name: Commit changes

        run: |

          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            stats/github-stats.svg \
            stats/top-languages.svg \
            stats/streak.svg \
            stats/contribution-activity.svg

          if git diff --cached --quiet; then

            echo \
              "No statistics changes detected."

            exit 0

          fi

          git commit \
            -m "chore: update profile statistics"

          git push
