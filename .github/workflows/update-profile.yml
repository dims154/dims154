          # CONTRIBUTION ACTIVITY
          #
          # FIXED ANIMATION SYSTEM
          #
          # The previous version used:
          #
          # stroke-dasharray:170 1150
          #
          # This caused the dash pattern to restart before matching
          # the real length of the graph.
          #
          # The new system uses:
          #
          # pathLength="1000"
          #
          # which normalizes the complete polyline to exactly 1000
          # animation units.
          #
          # The entire graph is then drawn from:
          #
          # 1000 -> 0
          #
          # This keeps the movement synchronized with the actual
          # polyline length.
          #
          # IMPORTANT:
          #
          # - No permanent graph line
          # - No opacity animation
          # - No dashed graph
          # - No fading
          # - No random dash reset
          # - Smooth left -> right
          # - Clean restart
          # ============================================================


          chart_x = 55

          chart_y = 105

          chart_w = 900

          chart_h = 165


          # ==========================================================
          # MAXIMUM CONTRIBUTION COUNT
          # ==========================================================

          max_count = max(

              (
                  day["count"]

                  for day in activity
              ),

              default=1,
          )


          # ==========================================================
          # BUILD COORDINATES
          # ==========================================================

          points = []


          for index, day in enumerate(activity):

              if len(activity) <= 1:

                  x = chart_x

              else:

                  x = (

                      chart_x

                      + index
                      * chart_w
                      / (len(activity) - 1)
                  )


              ratio = (

                  day["count"]
                  / max_count

                  if max_count
                  else 0
              )


              y = (

                  chart_y

                  + chart_h

                  - ratio * chart_h
              )


              points.append(
                  (x, y)
              )


          # ==========================================================
          # POLYLINE DATA
          # ==========================================================

          polyline = " ".join(

              f"{x:.2f},{y:.2f}"

              for x, y in points
          )


          # ==========================================================
          # WHITE COORDINATE POINTS
          # ==========================================================

          circles = "".join(

              f'<circle '
              f'cx="{x:.2f}" '
              f'cy="{y:.2f}" '
              f'r="3.2" '
              f'fill="#ffffff"/>'

              for x, y in points
          )


          # ==========================================================
          # DATE FORMAT
          # ==========================================================

          def date_label(value):

              return datetime.strptime(

                  value,

                  "%Y-%m-%d"

              ).strftime(
                  "%d/%m"
              )


          # ==========================================================
          # FIRST DATE
          # ==========================================================

          first_date = (

              date_label(
                  activity[0]["date"]
              )

              if activity

              else ""
          )


          # ==========================================================
          # LAST DATE
          # ==========================================================

          last_date = (

              date_label(
                  activity[-1]["date"]
              )

              if activity

              else ""
          )


          # ==========================================================
          # RECENT TOTAL
          # ==========================================================

          recent_total = sum(

              day["count"]

              for day in activity
          )


          # ==========================================================
          # DATE TICKS
          # ==========================================================

          ticks = []


          if activity:

              indexes = sorted(

                  set(

                      round(
                          i
                          * (len(activity) - 1)
                          / 4
                      )

                      for i in range(5)
                  )
              )


              for index in indexes:

                  x = (

                      chart_x

                      + index
                      * chart_w
                      / max(
                          1,
                          len(activity) - 1
                      )
                  )


                  ticks.append(

                      f'<text '
                      f'x="{x:.2f}" '
                      f'y="{chart_y + chart_h + 22}" '
                      f'fill="#ffffff" '
                      f'font-family="monospace" '
                      f'font-size="10" '
                      f'font-weight="bold" '
                      f'text-anchor="middle">'
                      f'{date_label(activity[index]["date"])}'
                      f'</text>'
                  )


          tick_nodes = "".join(
              ticks
          )


          # ==========================================================
          # CONTRIBUTION ACTIVITY SVG
          # ==========================================================

          activity_body = "".join(

              [

                  '<style>',


                  # --------------------------------------------------
                  # STATUS DOT
                  # --------------------------------------------------

                  '@keyframes pulse{'
                  '0%,100%{opacity:.30}'
                  '50%{opacity:1}'
                  '}',


                  # --------------------------------------------------
                  # CLEAN GRAPH DRAW
                  #
                  # pathLength=1000
                  #
                  # The complete polyline is normalized to 1000 units.
                  #
                  # stroke-dasharray:
                  #
                  # 1000 1000
                  #
                  # means:
                  #
                  # visible segment = 1000
                  # invisible segment = 1000
                  #
                  # stroke-dashoffset:
                  #
                  # 1000 -> 0
                  #
                  # progressively reveals the graph from left to right.
                  #
                  # At 96% the graph is fully visible.
                  #
                  # At 100% it instantly resets to hidden.
                  #
                  # This prevents the visible line from jumping back
                  # to the first point while the animation is active.
                  # --------------------------------------------------

                  '@keyframes drawGraph{'

                  '0%{'
                  'stroke-dashoffset:1000'
                  '}'

                  '92%{'
                  'stroke-dashoffset:0'
                  '}'

                  '96%{'
                  'stroke-dashoffset:0'
                  '}'

                  '96.01%{'
