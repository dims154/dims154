name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    # 08:00 WIB = 01:00 UTC
    - cron: "0 1 * * *"

permissions:
  contents: write

jobs:
  update-profile:
    name: Update GitHub Profile
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # FETCH GITHUB DATA
      # ==========================================================
      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql \
            -f query='
            query($login: String!) {
              user(login: $login) {
                name
                login

                followers {
                  totalCount
                }

                repositories(
                  ownerAffiliations: OWNER
                  first: 100
                  privacy: PUBLIC
                ) {
                  totalCount
                  nodes {
                    name
                    languages(
                      first: 20
                      orderBy: {
                        field: SIZE
                        direction: DESC
                      }
                    ) {
                      edges {
                        size
                        node {
                          name
                          color
                        }
                      }
                    }
                  }
                }

                contributionsCollection {
                  totalCommitContributions
                  restrictedContributionsCount

                  contributionCalendar {
                    totalContributions

                    weeks {
                      contributionDays {
                        date
                        contributionCount
                      }
                    }
                  }
                }
              }
            }' \
            -f login="dims154" \
            > github-data.json

      # ==========================================================
      # GENERATE ALL SVG FILES
      # ==========================================================
      - name: Generate profile statistics
        run: |
          mkdir -p assets stats

          python3 <<'PY'
          import json
          import html
          from pathlib import Path
          from collections import defaultdict
          from datetime import datetime

          # ======================================================
          # LOAD DATA
          # ======================================================

          with open("github-data.json", encoding="utf-8") as f:
              data = json.load(f)

          if "errors" in data:
              print("GitHub GraphQL error:")
              for error in data["errors"]:
                  print(error)
              raise SystemExit(1)

          user = data["data"]["user"]

          if user is None:
              raise SystemExit("GitHub user 'dims154' tidak ditemukan.")

          repositories_data = user["repositories"]
          repositories = repositories_data["totalCount"]
          followers = user["followers"]["totalCount"]

          calendar = (
              user["contributionsCollection"]
              ["contributionCalendar"]
          )

          total_contributions = calendar["totalContributions"]

          # ======================================================
          # CONTRIBUTION DAYS
          # ======================================================

          days = []

          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": day["contributionCount"]
                  })

          days.sort(key=lambda item: item["date"])
          last_31_days = days[-31:]

          # ======================================================
          # CURRENT STREAK
          # ======================================================

          current_streak = 0

          for day in reversed(days):
              if day["count"] > 0:
                  current_streak += 1
              else:
                  break

          # ======================================================
          # LONGEST STREAK
          # ======================================================

          longest_streak = 0
          running_streak = 0

          for day in days:
              if day["count"] > 0:
                  running_streak += 1
                  longest_streak = max(
                      longest_streak,
                      running_streak
                  )
              else:
                  running_streak = 0

          # ======================================================
          # LANGUAGES
          # ======================================================

          language_totals = defaultdict(int)
          language_colors = {}

          for repo in repositories_data["nodes"]:
              if not repo:
                  continue

              languages = repo.get("languages")

              if not languages:
                  continue

              for edge in languages["edges"]:
                  if not edge:
                      continue

                  node = edge.get("node")

                  if not node:
                      continue

                  language = node.get("name")
                  size = edge.get("size", 0)

                  if not language:
                      continue

                  language_totals[language] += size

                  if node.get("color"):
                      language_colors[language] = node["color"]

          top_languages = sorted(
              language_totals.items(),
              key=lambda item: item[1],
              reverse=True
          )[:6]

          total_language_size = sum(language_totals.values())

          # ======================================================
          # HELPERS
          # ======================================================

          def esc(value):
              return html.escape(str(value))

          def write_svg(path, width, height, content):
              # IMPORTANT:
              # This is deliberately NOT an f-string.
              # CSS { } therefore cannot break Python parsing.
              template = """<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg"
               width="__WIDTH__"
               height="__HEIGHT__"
               viewBox="0 0 __WIDTH__ __HEIGHT__">

            <defs>

              <linearGradient id="bg"
                              x1="0" y1="0"
                              x2="1" y2="1">
                <stop offset="0%" stop-color="#050000"/>
                <stop offset="50%" stop-color="#180006"/>
                <stop offset="100%" stop-color="#020000"/>
              </linearGradient>

              <linearGradient id="redLine"
                              x1="0" y1="0"
                              x2="1" y2="0">
                <stop offset="0%" stop-color="#ff003c"/>
                <stop offset="50%" stop-color="#ff1744"/>
                <stop offset="100%" stop-color="#ff003c"/>
              </linearGradient>

              <filter id="glow"
                      x="-50%" y="-50%"
                      width="200%" height="200%">
                <feGaussianBlur stdDeviation="3"
                                result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <filter id="softGlow"
                      x="-50%" y="-50%"
                      width="200%" height="200%">
                <feGaussianBlur stdDeviation="8"
                                result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>

              <pattern id="grid"
                       width="32"
                       height="32"
                       patternUnits="userSpaceOnUse">
                <path d="M 32 0 L 0 0 0 32"
                      fill="none"
                      stroke="#ff003c"
                      stroke-opacity="0.10"
                      stroke-width="1"/>
              </pattern>

              <pattern id="smallGrid"
                       width="8"
                       height="8"
                       patternUnits="userSpaceOnUse">
                <path d="M 8 0 L 0 0 0 8"
                      fill="none"
                      stroke="#ff003c"
                      stroke-opacity="0.035"
                      stroke-width="1"/>
              </pattern>

              <style>
                .title {
                  font-family: 'Courier New', monospace;
                  font-weight: bold;
                }

                .mono {
                  font-family: 'Courier New', monospace;
                }

                .red {
                  fill: #ff1744;
                }

                .white {
                  fill: #f5f5f5;
                }

                .muted {
                  fill: #a37b84;
                }

                .number {
                  fill: #ff1744;
                  font-weight: bold;
                }

                .card {
                  fill: #090306;
                  stroke: #ff1744;
                  stroke-opacity: 0.22;
                  stroke-width: 1;
                }

                .cardGlow {
                  fill: none;
                  stroke: #ff1744;
                  stroke-opacity: 0.08;
                  stroke-width: 4;
                  filter: url(#softGlow);
                  animation: glow 2.8s ease-in-out infinite;
                }

                .bar {
                  transform-box: fill-box;
                  transform-origin: left center;
                  animation: barGlow 2.4s ease-in-out infinite;
                }

                @keyframes barGlow {
                  0%, 100% {
                    opacity: 0.72;
                  }
                  50% {
                    opacity: 1;
                  }
                }

                @keyframes pulse {
                  0%, 100% {
                    opacity: 0.35;
                  }

                  50% {
                    opacity: 1;
                  }
                }

                @keyframes glow {
                  0%, 100% {
                    opacity: 0.55;
                  }

                  50% {
                    opacity: 1;
                  }
                }

                @keyframes scan {
                  0% {
                    transform: translateY(-150px);
                    opacity: 0;
                  }

                  15% {
                    opacity: 0.35;
                  }

                  50% {
                    opacity: 0.12;
                  }

                  100% {
                    transform: translateY(600px);
                    opacity: 0;
                  }
                }

                @keyframes dash {
                  to {
                    stroke-dashoffset: -100;
                  }
                }

                @keyframes blink {
                  0%, 45% {
                    opacity: 1;
                  }

                  50%, 100% {
                    opacity: 0.25;
                  }
                }

                .pulse {
                  animation: pulse 2s ease-in-out infinite;
                }

                .glow {
                  animation: glow 2.5s ease-in-out infinite;
                }

                .scan {
                  animation: scan 5s linear infinite;
                }

                .dash {
                  stroke-dasharray: 8 8;
                  animation: dash 2s linear infinite;
                }

                .blink {
                  animation: blink 1.5s step-end infinite;
                }
              </style>

            </defs>

            <rect width="100%"
                  height="100%"
                  rx="14"
                  fill="url(#bg)"/>

            <rect width="100%"
                  height="100%"
                  rx="14"
                  fill="url(#smallGrid)"/>

            <rect width="100%"
                  height="100%"
                  rx="14"
                  fill="url(#grid)"/>

            <rect x="4" y="4"
                  width="__OUTER_WIDTH__"
                  height="__OUTER_HEIGHT__"
                  rx="12"
                  fill="none"
                  stroke="#ff003c"
                  stroke-width="5"
                  opacity="0.15"
                  filter="url(#softGlow)"
                  class="glow"/>

            <rect x="6" y="6"
                  width="__BORDER_WIDTH__"
                  height="__BORDER_HEIGHT__"
                  rx="12"
                  fill="none"
                  stroke="url(#redLine)"
                  stroke-width="1.5"
                  filter="url(#glow)"/>

            <rect x="10" y="10"
                  width="__SCAN_WIDTH__"
                  height="2"
                  fill="#ff1744"
                  opacity="0.2"
                  class="scan"/>

            __CONTENT__

          </svg>
          """

              svg = (
                  template
                  .replace("__WIDTH__", str(width))
                  .replace("__HEIGHT__", str(height))
                  .replace(
                      "__OUTER_WIDTH__",
                      str(width - 8)
                  )
                  .replace(
                      "__OUTER_HEIGHT__",
                      str(height - 8)
                  )
                  .replace(
                      "__BORDER_WIDTH__",
                      str(width - 12)
                  )
                  .replace(
                      "__BORDER_HEIGHT__",
                      str(height - 12)
                  )
                  .replace(
                      "__SCAN_WIDTH__",
                      str(width - 20)
                  )
                  .replace(
                      "__CONTENT__",
                      content
                  )
              )

              Path(path).write_text(
                  svg,
                  encoding="utf-8"
              )

          # ======================================================
          # PROFILE HERO
          # ======================================================

          hero = """
            <text x="55" y="48"
                  class="mono red"
                  font-size="13"
                  letter-spacing="3">
              SYSTEM / PROFILE / DIMS154
            </text>

            <circle cx="1085" cy="45"
                    r="6"
                    fill="#ff1744"
                    filter="url(#glow)"
                    class="blink"/>

            <text x="1105" y="50"
                  class="mono muted"
                  font-size="11">
              ONLINE
            </text>

            <text x="55" y="125"
                  class="title white"
                  font-size="42"
                  letter-spacing="2">
              MUHAMMAD ILHAM
            </text>

            <text x="58" y="158"
                  class="mono red"
                  font-size="15"
                  letter-spacing="4">
              BACKEND DEVELOPER
            </text>

            <text x="58" y="205"
                  class="mono white"
                  font-size="13">
              INFORMATION SYSTEMS STUDENT
            </text>

            <text x="58" y="230"
                  class="mono muted"
                  font-size="11"
                  letter-spacing="1">
              SYSTEM DESIGN · ENTERPRISE ARCHITECTURE · AUTOMATION
            </text>

            <path d="M 55 270
                     H 310
                     L 330 250
                     H 470"
                  fill="none"
                  stroke="#ff1744"
                  stroke-width="1"
                  opacity="0.6"
                  class="dash"/>

            <circle cx="55" cy="270"
                    r="4"
                    fill="#ff1744"
                    filter="url(#glow)"
                    class="pulse"/>

            <text x="70" y="275"
                  class="mono red"
                  font-size="10">
              ONLINE / BUILDING / LEARNING
            </text>

            <path d="M 820 105
                     L 930 105
                     L 970 145
                     H 1135"
                  fill="none"
                  stroke="#ff1744"
                  stroke-width="1"
                  opacity="0.18"/>

            <path d="M 850 105
                     L 930 55
                     L 1000 105"
                  fill="none"
                  stroke="#ff1744"
                  stroke-width="1"
                  opacity="0.13"/>

            <circle cx="930" cy="105"
                    r="3"
                    fill="#ff1744"
                    class="pulse"/>

            <line x1="55" y1="315"
                  x2="1145" y2="315"
                  stroke="#ff1744"
                  stroke-opacity="0.35"/>

            <text x="55" y="338"
                  class="mono muted"
                  font-size="9">
              BACKEND · ARCHITECTURE · DATABASE · AUTOMATION · ANALYTICS
            </text>

            <text x="1050" y="338"
                  class="mono red"
                  font-size="9">
              v2.0
            </text>
          """

          write_svg(
              "assets/profile-hero.svg",
              1200,
              360,
              hero
          )

          # ======================================================
          # GITHUB STATISTICS
          # ======================================================

          stats = f"""
            <text x="55" y="55"
                  class="title red"
                  font-size="24"
                  letter-spacing="1">
              GITHUB STATISTICS
            </text>

            <circle cx="900" cy="48"
                    r="5"
                    fill="#ff1744"
                    filter="url(#glow)"
                    class="pulse"/>

            <text x="915" y="52"
                  class="mono muted"
                  font-size="9">
              LIVE
            </text>

            <text x="55" y="80"
                  class="mono muted"
                  font-size="10">
              REAL-TIME PROFILE DATA / DIMS154
            </text>

            <line x1="55" y1="98"
                  x2="945" y2="98"
                  stroke="#ff1744"
                  stroke-opacity="0.25"/>

            <rect x="55" y="112" width="270" height="105" rx="8" class="card"/>
            <rect x="55" y="112" width="270" height="105" rx="8" class="cardGlow"/>
            <text x="75" y="140" class="mono muted" font-size="10">
              CONTRIBUTIONS
            </text>
            <text x="75" y="185" class="number" font-size="40">
              {esc(total_contributions)}
            </text>
            <text x="75" y="204" class="mono muted" font-size="8">
              TOTAL CONTRIBUTION COUNT
            </text>

            <rect x="365" y="112" width="270" height="105" rx="8" class="card"/>
            <rect x="365" y="112" width="270" height="105" rx="8" class="cardGlow"/>
            <text x="385" y="140" class="mono muted" font-size="10">
              REPOSITORIES
            </text>
            <text x="385" y="185" class="number" font-size="40">
              {esc(repositories)}
            </text>
            <text x="385" y="204" class="mono muted" font-size="8">
              PUBLIC OWNER REPOSITORIES
            </text>

            <rect x="675" y="112" width="270" height="105" rx="8" class="card"/>
            <rect x="675" y="112" width="270" height="105" rx="8" class="cardGlow"/>
            <text x="695" y="140" class="mono muted" font-size="10">
              FOLLOWERS
            </text>
            <text x="695" y="185" class="number" font-size="40">
              {esc(followers)}
            </text>
            <text x="695" y="204" class="mono muted" font-size="8">
              PROFILE FOLLOWERS
            </text>

            <text x="55" y="255" class="mono muted" font-size="10">
              CURRENT STREAK
            </text>
            <text x="55" y="288" class="number" font-size="25">
              {esc(current_streak)} DAYS
            </text>

            <text x="365" y="255" class="mono muted" font-size="10">
              LONGEST STREAK
            </text>
            <text x="365" y="288" class="number" font-size="25">
              {esc(longest_streak)} DAYS
            </text>

            <text x="675" y="255" class="mono muted" font-size="10">
              SYSTEM STATUS
            </text>
            <circle cx="686" cy="282"
                    r="5"
                    fill="#ff1744"
                    filter="url(#glow)"
                    class="pulse"/>
            <text x="701" y="287"
                  class="mono red"
                  font-size="12">
              ACTIVE / TRACKING
            </text>

            <line x1="55" y1="307"
                  x2="945" y2="307"
                  stroke="#ff1744"
                  stroke-opacity="0.15"
                  stroke-dasharray="5 8"
                  class="dash"/>

            <text x="55" y="321"
                  class="mono muted"
                  font-size="8">
              AUTOMATICALLY GENERATED FROM GITHUB API
            </text>
          """

          write_svg(
              "stats/github-stats.svg",
              1000,
              330,
              stats
          )

          # ======================================================
          # TOP LANGUAGES
          # ======================================================

          language_rows = ""

          if top_languages:
              y = 125

              for language, size in top_languages:
                  percentage = (
                      size / total_language_size * 100
                      if total_language_size
                      else 0
                  )

                  color = language_colors.get(
                      language,
                      "#ff1744"
                  )

                  bar_width = max(
                      25,
                      min(650, percentage * 6.2)
                  )

                  language_rows += f"""
                    <text x="65" y="{y}"
                          class="mono white"
                          font-size="12">
                      {esc(language)}
                    </text>

                    <rect x="210"
                          y="{y - 13}"
                          width="650"
                          height="12"
                          rx="6"
                          fill="#25070d"/>

                    <rect x="210"
                          y="{y - 13}"
                          width="{bar_width:.1f}"
                          height="12"
                          rx="6"
                          fill="{esc(color)}"
                          opacity="0.9"
                          filter="url(#glow)"/>

                    <text x="885" y="{y}"
                          class="mono red"
                          font-size="11"
                          text-anchor="end">
                      {percentage:.1f}%
                    </text>
                  """

                  y += 40

          else:
              language_rows = """
                <text x="500" y="180"
                      class="mono muted"
                      font-size="13"
                      text-anchor="middle">
                  NO LANGUAGE DATA AVAILABLE
                </text>
              """

          languages_svg = f"""
            <text x="55" y="55"
                  class="title red"
                  font-size="24"
                  letter-spacing="1">
              TOP LANGUAGES
            </text>

            <text x="55" y="80"
                  class="mono muted"
                  font-size="10">
              LANGUAGE DISTRIBUTION BY CODE SIZE
            </text>

            <line x1="55" y1="98"
                  x2="945" y2="98"
                  stroke="#ff1744"
                  stroke-opacity="0.25"/>

            {language_rows}

            <text x="55" y="365"
                  class="mono muted"
                  font-size="9">
              AUTOMATICALLY GENERATED WITH GITHUB ACTIONS
            </text>
          """

          write_svg(
              "stats/top-languages.svg",
              1000,
              390,
              languages_svg
          )

          # ======================================================
          # STREAK
          # ======================================================

          streak_svg = f"""
            <text x="55" y="55"
                  class="title red"
                  font-size="24"
                  letter-spacing="1">
              CONTRIBUTION STREAK
            </text>

            <line x1="55" y1="80"
                  x2="945" y2="80"
                  stroke="#ff1744"
                  stroke-opacity="0.25"/>

            <circle cx="285" cy="145"
                    r="7"
                    fill="#ff1744"
                    filter="url(#glow)"
                    class="pulse"/>

            <text x="305" y="150"
                  class="mono muted"
                  font-size="11">
              CURRENT STREAK
            </text>

            <text x="305" y="205"
                  class="number"
                  font-size="50">
              {esc(current_streak)}
            </text>

            <text x="305" y="228"
                  class="mono muted"
                  font-size="10">
              DAYS
            </text>

            <circle cx="655" cy="145"
                    r="7"
                    fill="#ff1744"
                    filter="url(#glow)"
                    class="pulse"/>

            <text x="675" y="150"
                  class="mono muted"
                  font-size="11">
              LONGEST STREAK
            </text>

            <text x="675" y="205"
                  class="number"
                  font-size="50">
              {esc(longest_streak)}
            </text>

            <text x="675" y="228"
                  class="mono muted"
                  font-size="10">
              DAYS
            </text>

            <path d="M 150 270 H 850"
                  stroke="#ff1744"
                  stroke-opacity="0.18"
                  stroke-dasharray="6 8"
                  class="dash"/>

            <text x="500" y="295"
                  class="mono muted"
                  font-size="9"
                  text-anchor="middle">
              AUTOMATICALLY GENERATED AND UPDATED WITH GITHUB ACTIONS
            </text>
          """

          write_svg(
              "stats/streak.svg",
              1000,
              330,
              streak_svg
          )

          # ======================================================
          # CONTRIBUTION ACTIVITY
          # Build chart coordinates from the real 31-day contribution data.
          chart_left = 85
          chart_right = 925
          chart_top = 125
          chart_bottom = 305
          max_value = max((value for _, value in activity_data), default=1)
          max_value = max(max_value, 1)

          point_coords = []
          date_labels = []

          for index, (date_value, value) in enumerate(activity_data):
              ratio = index / max(len(activity_data) - 1, 1)
              x = chart_left + ratio * (chart_right - chart_left)
              y = chart_bottom - (value / max_value) * (chart_bottom - chart_top)
              point_coords.append((round(x, 1), round(y, 1)))

          points = " ".join(f"{x},{y}" for x, y in point_coords)

          for index, (date_value, _) in enumerate(activity_data):
              if index % max(len(activity_data) // 6, 1) == 0 or index == len(activity_data) - 1:
                  ratio = index / max(len(activity_data) - 1, 1)
                  x = chart_left + ratio * (chart_right - chart_left)
                  date_labels.append((round(x, 1), date_value.strftime("%m/%d")))

          activity = f"""
            <text x="55" y="50"
                  class="title red"
                  font-size="24"
                  letter-spacing="1">
              CONTRIBUTION ACTIVITY
            </text>

            <circle cx="900" cy="43"
                    r="5"
                    fill="#ff1744"
                    filter="url(#glow)"
                    class="pulse"/>

            <text x="915" y="47"
                  class="mono muted"
                  font-size="9">
              LIVE
            </text>

            <text x="55" y="74"
                  class="mono muted"
                  font-size="9"
                  letter-spacing="1">
              LAST 31 DAYS / ACTIVITY MONITOR / MM/DD
            </text>

            <line x1="55" y1="92"
                  x2="945" y2="92"
                  stroke="#ff1744"
                  stroke-opacity="0.25"/>

            <rect x="55" y="108"
                  width="890"
                  height="215"
                  rx="10"
                  fill="#080305"
                  stroke="#ff1744"
                  stroke-opacity="0.20"/>

            <rect x="55" y="108"
                  width="890"
                  height="215"
                  rx="10"
                  fill="none"
                  stroke="#ff1744"
                  stroke-opacity="0.08"
                  stroke-width="5"
                  filter="url(#softGlow)"/>

            <path d="M75 145H925
                     M75 185H925
                     M75 225H925
                     M75 265H925
                     M75 305H925"
                  stroke="#ff1744"
                  stroke-opacity="0.10"
                  stroke-width="1"/>

            <path d="M75 125V305
                     M245 125V305
                     M415 125V305
                     M585 125V305
                     M755 125V305
                     M925 125V305"
                  stroke="#ff1744"
                  stroke-opacity="0.08"
                  stroke-width="1"/>

            <text x="65" y="148" class="mono muted" font-size="8">30</text>
            <text x="65" y="188" class="mono muted" font-size="8">20</text>
            <text x="65" y="228" class="mono muted" font-size="8">10</text>
            <text x="65" y="308" class="mono muted" font-size="8">0</text>

            <polyline points="{points}"
                      fill="none"
                      stroke="#ff1744"
                      stroke-width="3"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      filter="url(#glow)"
                      class="dash"/>

            <polyline points="{points}"
                      fill="none"
                      stroke="#ff667f"
                      stroke-opacity="0.25"
                      stroke-width="8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      filter="url(#softGlow)"/>

            {''.join(
                f'<circle cx="{x}" cy="{y}" r="3.5" fill="#ff1744" filter="url(#glow)" class="pulse"/>'
                for x, y in point_coords
            )}

            {''.join(
                f'<text x="{x}" y="338" text-anchor="middle" class="mono muted" font-size="8">{label}</text>'
                for x, label in date_labels
            )}

            <text x="55" y="365"
                  class="mono muted"
                  font-size="8">
              CONTRIBUTION SIGNAL
            </text>

            <circle cx="185" cy="361"
                    r="4"
                    fill="#ff1744"
                    filter="url(#glow)"
                    class="pulse"/>

            <text x="200" y="365"
                  class="mono red"
                  font-size="9">
              ACTIVE
            </text>

            <text x="945" y="365"
                  text-anchor="end"
                  class="mono muted"
                  font-size="8">
              AUTO-GENERATED / GITHUB ACTIONS
            </text>
          """

          write_svg(
              "stats/contribution-activity.svg",
              graph_width,
              graph_height,
              activity_svg
          )

          # ======================================================
          # VALIDATE
          # ======================================================

          required = [
              "assets/profile-hero.svg",
              "stats/github-stats.svg",
              "stats/top-languages.svg",
              "stats/streak.svg",
              "stats/contribution-activity.svg"
          ]

          print("")
          print("==========================================")
          print(" GENERATED PROFILE FILES")
          print("==========================================")

          for file_name in required:
              path = Path(file_name)

              if not path.exists():
                  raise SystemExit(
                      f"Missing generated file: {file_name}"
                  )

              if path.stat().st_size == 0:
                  raise SystemExit(
                      f"Empty generated file: {file_name}"
                  )

              print(
                  f"OK  {file_name} "
                  f"({path.stat().st_size} bytes)"
              )

          print("")
          print("SVG generation completed successfully.")
          print("==========================================")

          Path("github-data.json").unlink(
              missing_ok=True
          )

          PY

      # ==========================================================
      # CHECK FILES
      # ==========================================================
      - name: Check generated files
        run: |
          echo "Checking generated SVG files..."

          test -s assets/profile-hero.svg
          test -s stats/github-stats.svg
          test -s stats/top-languages.svg
          test -s stats/streak.svg
          test -s stats/contribution-activity.svg

          echo "All generated SVG files exist."

      # ==========================================================
      # COMMIT + PUSH
      # ==========================================================
      - name: Commit generated statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/profile-hero.svg
          git add stats/github-stats.svg
          git add stats/top-languages.svg
          git add stats/streak.svg
          git add stats/contribution-activity.svg

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "chore: update GitHub profile statistics"
          git push

      # ==========================================================
      # COMPLETE
      # ==========================================================
      - name: Complete
        run: |
          echo "=========================================="
          echo " GitHub profile update completed."
          echo "=========================================="
