name: Update GitHub Profile Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update-profile:
    name: Generate Profile Statistics
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # ============================================================
      # FETCH GITHUB DATA
      # ============================================================

      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          set -euo pipefail

          gh api graphql \
            -f query='
              query($login: String!) {

                user(login: $login) {

                  login

                  followers {
                    totalCount
                  }

                  repositories(
                    ownerAffiliations: OWNER
                    first: 100
                    privacy: PUBLIC
                  ) {

                    totalCount

                    nodes {

                      name

                      languages(
                        first: 20
                        orderBy: {
                          field: SIZE
                          direction: DESC
                        }
                      ) {

                        edges {
                          size

                          node {
                            name
                          }
                        }
                      }
                    }
                  }

                  contributionsCollection {

                    totalCommitContributions

                    contributionCalendar {

                      totalContributions

                      weeks {

                        contributionDays {

                          date

                          contributionCount
                        }
                      }
                    }
                  }
                }

              }' \
            -f login="dims154" \
            > github-data.json

          python3 - <<'PY'
          import json

          with open(
              "github-data.json",
              encoding="utf-8"
          ) as file:
              data = json.load(file)

          if data.get("errors"):

              for error in data["errors"]:
                  print(error)

              raise SystemExit(1)

          if not data.get("data", {}).get("user"):
              raise SystemExit(
                  "GitHub user 'dims154' was not found."
              )

          print(
              "GitHub data fetched successfully."
          )
          PY

      # ============================================================
      # GENERATE PROFILE STATISTICS
      # ============================================================

      - name: Generate profile statistics

        run: |
          set -euo pipefail

          rm -rf generated-stats

          mkdir -p generated-stats
          mkdir -p stats

          python3 - <<'PY'

          import html
          import json

          from collections import defaultdict

          from datetime import datetime

          from pathlib import Path


          # ==========================================================
          # CONFIGURATION
          # ==========================================================

          OUT = Path("generated-stats")


          # ==========================================================
          # LOAD DATA
          # ==========================================================

          with open(
              "github-data.json",
              encoding="utf-8"
          ) as file:

              payload = json.load(file)


          user = payload["data"]["user"]

          repos = user["repositories"]

          collection = user["contributionsCollection"]

          calendar = collection["contributionCalendar"]


          # ==========================================================
          # BASIC STATISTICS
          # ==========================================================

          repositories = int(
              repos["totalCount"]
          )

          followers = int(
              user["followers"]["totalCount"]
          )

          total_contributions = int(
              calendar["totalContributions"]
          )

          commits = int(
              collection["totalCommitContributions"]
          )


          # ==========================================================
          # CONTRIBUTION DAYS
          # ==========================================================

          days = []

          for week in calendar["weeks"]:

              for day in week["contributionDays"]:

                  days.append(
                      {
                          "date": day["date"],
                          "count": int(
                              day["contributionCount"]
                          ),
                      }
                  )


          days.sort(
              key=lambda item: item["date"]
          )


          # ==========================================================
          # LAST 31 DAYS
          # ==========================================================

          activity = days[-31:]


          # ==========================================================
          # CURRENT STREAK
          # ==========================================================

          current_streak = 0

          for day in reversed(days):

              if day["count"] > 0:

                  current_streak += 1

              else:

                  break


          # ==========================================================
          # LONGEST STREAK
          # ==========================================================

          longest_streak = 0

          running = 0

          for day in days:

              if day["count"] > 0:

                  running += 1

                  longest_streak = max(
                      longest_streak,
                      running
                  )

              else:

                  running = 0


          # ==========================================================
          # LANGUAGE STATISTICS
          # ==========================================================

          language_totals = defaultdict(int)


          for repo in repos["nodes"]:

              if not repo:
                  continue


              language_data = (
                  repo.get("languages")
                  or {}
              )


              for edge in language_data.get(
                  "edges",
                  []
              ):

                  if not edge:
                      continue

                  if not edge.get("node"):
                      continue


                  name = edge["node"].get(
                      "name"
                  )


                  if name:

                      language_totals[name] += int(
                          edge.get("size") or 0
                      )


          top_languages = sorted(
              language_totals.items(),
              key=lambda item: item[1],
              reverse=True,
          )[:6]


          total_language_size = sum(
              language_totals.values()
          )


          # ==========================================================
          # HELPERS
          # ==========================================================

          def esc(value):

