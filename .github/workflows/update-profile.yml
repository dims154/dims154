name: Update GitHub Profile Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update-profile:
    name: Generate Profile Statistics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Fetch GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api graphql \
            -f query='
              query($login: String!) {
                user(login: $login) {
                  name
                  login
                  followers { totalCount }

                  repositories(
                    ownerAffiliations: OWNER
                    first: 100
                    privacy: PUBLIC
                  ) {
                    totalCount
                    nodes {
                      name
                      languages(
                        first: 20
                        orderBy: { field: SIZE, direction: DESC }
                      ) {
                        edges {
                          size
                          node { name color }
                        }
                      }
                    }
                  }

                  contributionsCollection {
                    totalCommitContributions
                    contributionCalendar {
                      totalContributions
                      weeks {
                        contributionDays {
                          date
                          contributionCount
                        }
                      }
                    }
                  }
                }
              }' \
            -f login="dims154" \
            > github-data.json

          python3 - <<'PY'
          import json

          with open("github-data.json", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("errors"):
              print("GitHub GraphQL returned errors:")
              for error in data["errors"]:
                  print(error)
              raise SystemExit(1)

          if not data.get("data", {}).get("user"):
              raise SystemExit("GitHub user 'dims154' was not found.")

          print("GitHub data fetched successfully.")
          PY

      - name: Generate statistics
        run: |
          set -euo pipefail
          rm -rf generated-stats
          mkdir -p generated-stats

          python3 - <<'PY'
          import html
          import json
          from datetime import datetime
          from collections import defaultdict
          from pathlib import Path

          OUT = Path("generated-stats")

          with open("github-data.json", encoding="utf-8") as f:
              payload = json.load(f)

          user = payload["data"]["user"]
          repos = user["repositories"]
          collection = user["contributionsCollection"]
          calendar = collection["contributionCalendar"]

          repositories = int(repos["totalCount"])
          followers = int(user["followers"]["totalCount"])
          total_contributions = int(calendar["totalContributions"])
          commits = int(collection["totalCommitContributions"])

          days = []
          for week in calendar["weeks"]:
              for day in week["contributionDays"]:
                  days.append({
                      "date": day["date"],
                      "count": int(day["contributionCount"]),
                  })

          days.sort(key=lambda item: item["date"])
          activity = days[-31:]

          current_streak = 0
          for day in reversed(days):
              if day["count"] > 0:
                  current_streak += 1
              else:
                  break

          longest_streak = 0
          running = 0
          for day in days:
              if day["count"] > 0:
                  running += 1
                  longest_streak = max(longest_streak, running)
              else:
                  running = 0

          language_totals = defaultdict(int)
          for repo in repos["nodes"]:
              if not repo:
                  continue
              for edge in (repo.get("languages") or {}).get("edges", []):
                  if edge and edge.get("node") and edge["node"].get("name"):
                      language_totals[edge["node"]["name"]] += int(edge.get("size") or 0)

          top_languages = sorted(
              language_totals.items(),
              key=lambda item: item[1],
              reverse=True,
          )[:6]

          total_language_size = sum(language_totals.values())

          def esc(value):
              return html.escape(str(value))

          def svg_start(width, height, title):
              title = esc(title)
              return (
                  '<?xml version="1.0" encoding="UTF-8"?>'
                  f'<svg xmlns="http://www.w3.org/2000/svg" width="{width}" '
                  f'height="{height}" viewBox="0 0 {width} {height}" '
                  f'role="img" aria-label="{title}">'
                  '<defs>'
                  '<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">'
                  '<stop offset="0%" stop-color="#050005"/>'
                  '<stop offset="55%" stop-color="#160008"/>'
                  '<stop offset="100%" stop-color="#020002"/>'
                  '</linearGradient>'
                  '<linearGradient id="red" x1="0" y1="0" x2="1" y2="0">'
                  '<stop offset="0%" stop-color="#ff003c"/>'
                  '<stop offset="50%" stop-color="#ff1744"/>'
                  '<stop offset="100%" stop-color="#ff003c"/>'
                  '</linearGradient>'
                  '<filter id="glow" x="-50%" y="-50%" width="200%" height="200%">'
                  '<feGaussianBlur stdDeviation="3" result="blur"/>'
                  '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>'
                  '</filter>'
                  '<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">'
                  '<path d="M32 0H0V32" fill="none" stroke="#ff003c" stroke-opacity=".08"/>'
                  '</pattern>'
                  '</defs>'
                  '<rect width="100%" height="100%" rx="14" fill="url(#bg)"/>'
                  '<rect width="100%" height="100%" rx="14" fill="url(#grid)"/>'
                  f'<rect x="7" y="7" width="{width-14}" height="{height-14}" '
                  'rx="11" fill="none" stroke="url(#red)" stroke-opacity=".65"/>'
              )

          def write_svg(name, width, height, title, body):
              path = OUT / name
              path.write_text(
                  svg_start(width, height, title) + body + "</svg>\n",
                  encoding="utf-8",
              )
              print(f"Generated {path}")

          stats = (
              '<style>'
              '@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}'
              '@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:.18}50%{opacity:.08}85%{opacity:.18}100%{transform:translateY(185px);opacity:0}}'
              '@keyframes dash{to{stroke-dashoffset:-120}}'
              '.pulse{animation:pulse 2s ease-in-out infinite}'
              '.scan{animation:scan 5s linear infinite}'
              '.dash{stroke-dasharray:8 8;animation:dash 2s linear infinite}'
              '</style>'

              '<rect x="0" y="0" width="1020" height="330" rx="14" fill="#050005" fill-opacity=".72"/>'

              '<text x="38" y="42" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="22">GITHUB STATISTICS</text>'
              '<text x="38" y="64" fill="#9d7a82" font-family="monospace" font-size="10">LATEST PROFILE SNAPSHOT / DIMS154 / SYSTEM MONITOR</text>'

              '<circle cx="944" cy="36" r="7" fill="#ff1744" filter="url(#glow)" class="pulse"/>'
              '<text x="958" y="40" fill="#9d7a82" font-family="monospace" font-size="10">ONLINE</text>'

              '<line x1="38" y1="82" x2="982" y2="82" stroke="#ff1744" stroke-opacity=".22"/>'
              '<line x1="38" y1="84" x2="982" y2="84" stroke="#ff1744" stroke-opacity=".06" stroke-dasharray="2 8"/>'

              # Animated scan line.
              '<rect x="38" y="88" width="944" height="2" fill="#ff1744" fill-opacity=".18" class="scan"/>'

              # Metric separators.
              '<line x1="245" y1="105" x2="245" y2="180" stroke="#ff1744" stroke-opacity=".10"/>'
              '<line x1="470" y1="105" x2="470" y2="180" stroke="#ff1744" stroke-opacity=".10"/>'
              '<line x1="695" y1="105" x2="695" y2="180" stroke="#ff1744" stroke-opacity=".10"/>'

              f'<text x="38" y="112" fill="#9d7a82" font-family="monospace" font-size="9">REPOSITORIES</text>'
              f'<text x="38" y="162" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="40">{repositories}</text>'
              '<text x="38" y="178" fill="#6d4f57" font-family="monospace" font-size="8">PUBLIC OWNER PROJECTS</text>'

              '<text x="278" y="112" fill="#9d7a82" font-family="monospace" font-size="9">FOLLOWERS</text>'
              f'<text x="278" y="162" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="40">{followers}</text>'
              '<text x="278" y="178" fill="#6d4f57" font-family="monospace" font-size="8">PROFILE FOLLOWERS</text>'

              '<text x="503" y="112" fill="#9d7a82" font-family="monospace" font-size="9">CONTRIBUTIONS</text>'
              f'<text x="503" y="162" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="40">{total_contributions}</text>'
              '<text x="503" y="178" fill="#6d4f57" font-family="monospace" font-size="8">CONTRIBUTION COUNT</text>'

              '<text x="728" y="112" fill="#9d7a82" font-family="monospace" font-size="9">COMMITS</text>'
              f'<text x="728" y="162" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="40">{commits}</text>'
              '<text x="728" y="178" fill="#6d4f57" font-family="monospace" font-size="8">COMMIT CONTRIBUTIONS</text>'

              '<line x1="38" y1="198" x2="982" y2="198" stroke="#ff1744" stroke-opacity=".14"/>'

              '<text x="38" y="224" fill="#9d7a82" font-family="monospace" font-size="9">CONTRIBUTION WINDOW</text>'
              '<text x="38" y="250" fill="#f4f4f4" font-family="monospace" font-size="12">LAST 365 DAYS</text>'

              '<text x="390" y="224" fill="#9d7a82" font-family="monospace" font-size="9">CURRENT STREAK</text>'
              f'<text x="390" y="250" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="26">{current_streak} {"DAY" if current_streak == 1 else "DAYS"}</text>'

              '<text x="660" y="224" fill="#9d7a82" font-family="monospace" font-size="9">LONGEST STREAK</text>'
              f'<text x="660" y="250" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="26">{longest_streak} {"DAY" if longest_streak == 1 else "DAYS"}</text>'

              '<path d="M38 280 H982" stroke="#ff1744" stroke-opacity=".35" fill="none" class="dash"/>'

              '<circle cx="38" cy="303" r="3.5" fill="#ff1744" filter="url(#glow)" class="pulse"/>'
              '<text x="50" y="307" fill="#9d7a82" font-family="monospace" font-size="8">AUTO-GENERATED</text>'
              '<text x="982" y="307" fill="#6d4f57" font-family="monospace" font-size="8" text-anchor="end">GITHUB ACTIONS / PROFILE STATS</text>'
          )
          write_svg("github-stats.svg", 1020, 330, "GitHub statistics for dims154", stats)

          language_body = (
              '<style>'
              '@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}'
              '@keyframes sweep{0%{transform:translateX(0);opacity:0}20%{opacity:.12}50%{opacity:.22}80%{opacity:.12}100%{transform:translateX(700px);opacity:0}}'
              '@keyframes barPulse{0%,100%{opacity:.65}50%{opacity:1}}'
              '.pulse{animation:pulse 2s ease-in-out infinite}'
              '.sweep{animation:sweep 4.5s linear infinite}'
              '.barPulse{animation:barPulse 2.6s ease-in-out infinite}'
              '</style>'

              '<rect x="0" y="0" width="1020" height="375" rx="14" fill="#050005" fill-opacity=".72"/>'
              '<text x="38" y="42" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="22">TOP LANGUAGES</text>'
              '<text x="38" y="64" fill="#9d7a82" font-family="monospace" font-size="10">PUBLIC REPOSITORIES / LANGUAGE DISTRIBUTION</text>'
              '<circle cx="944" cy="36" r="7" fill="#ff1744" filter="url(#glow)" class="pulse"/>'
              '<text x="958" y="40" fill="#9d7a82" font-family="monospace" font-size="10">SYNCED</text>'

              '<line x1="38" y1="82" x2="982" y2="82" stroke="#ff1744" stroke-opacity=".22"/>'
              '<line x1="38" y1="84" x2="982" y2="84" stroke="#ff1744" stroke-opacity=".06" stroke-dasharray="2 8"/>'
              '<rect x="205" y="92" width="680" height="2" fill="#ff1744" fill-opacity=".16" class="sweep"/>'
          )

          if not top_languages:
              language_body += (
                  '<text x="38" y="125" fill="#9d7a82" font-family="monospace" font-size="12">'
                  'NO PUBLIC LANGUAGE DATA AVAILABLE</text>'
              )
          else:
              y = 112
              for index, (name, size) in enumerate(top_languages):
                  pct = (size / total_language_size * 100) if total_language_size else 0
                  bar = max(4, 680 * pct / 100)

                  language_body += (
                      f'<text x="38" y="{y}" fill="#f4f4f4" font-family="monospace" '
                      f'font-size="12">{esc(name)}</text>'

                      f'<text x="900" y="{y}" fill="#ff1744" font-family="monospace" '
                      f'font-size="11" text-anchor="end">{pct:.1f}%</text>'

                      f'<rect x="205" y="{y-13}" width="680" height="11" rx="5.5" '
                      f'fill="#210007"/>'

                      f'<rect x="205" y="{y-13}" width="{bar:.2f}" height="11" rx="5.5" '
                      f'fill="url(#red)" filter="url(#glow)" class="barPulse"/>'

                      f'<circle cx="{205 + bar:.2f}" cy="{y-7.5}" r="3.5" '
                      f'fill="#ff1744" filter="url(#glow)" class="pulse"/>'
                  )
                  y += 40

          language_body += (
              '<line x1="38" y1="330" x2="982" y2="330" stroke="#ff1744" stroke-opacity=".14"/>'
              '<circle cx="38" cy="350" r="3.5" fill="#ff1744" filter="url(#glow)" class="pulse"/>'
              '<text x="50" y="354" fill="#9d7a82" font-family="monospace" font-size="9">LANGUAGE SIGNAL / AUTO-GENERATED</text>'
              '<text x="982" y="354" fill="#6d4f57" font-family="monospace" font-size="8" text-anchor="end">GITHUB REPOSITORY BREAKDOWN</text>'
          )

          write_svg("top-languages.svg", 1020, 375, "Top languages for dims154", language_body)

          streak = (
              '<style>'
              '@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}'
              '@keyframes scan{0%{transform:translateY(0);opacity:0}20%{opacity:.10}50%{opacity:.18}80%{opacity:.10}100%{transform:translateY(125px);opacity:0}}'
              '@keyframes dash{to{stroke-dashoffset:-120}}'
              '.pulse{animation:pulse 2s ease-in-out infinite}'
              '.scan{animation:scan 5s linear infinite}'
              '.dash{stroke-dasharray:8 8;animation:dash 2s linear infinite}'
              '</style>'

              '<rect x="0" y="0" width="1020" height="325" rx="14" fill="#050005" fill-opacity=".72"/>'
              '<text x="38" y="42" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="22">CONTRIBUTION STREAK</text>'
              '<text x="38" y="64" fill="#9d7a82" font-family="monospace" font-size="10">CONSISTENCY MONITOR / DIMS154</text>'

              '<circle cx="944" cy="36" r="7" fill="#ff1744" filter="url(#glow)" class="pulse"/>'
              '<text x="958" y="40" fill="#9d7a82" font-family="monospace" font-size="10">SYNCED</text>'

              '<line x1="38" y1="82" x2="982" y2="82" stroke="#ff1744" stroke-opacity=".22"/>'
              '<line x1="38" y1="84" x2="982" y2="84" stroke="#ff1744" stroke-opacity=".06" stroke-dasharray="2 8"/>'

              '<rect x="38" y="92" width="944" height="2" fill="#ff1744" fill-opacity=".18" class="scan"/>'

              '<line x1="340" y1="108" x2="340" y2="205" stroke="#ff1744" stroke-opacity=".10"/>'
              '<line x1="650" y1="108" x2="650" y2="205" stroke="#ff1744" stroke-opacity=".10"/>'

              '<text x="38" y="116" fill="#9d7a82" font-family="monospace" font-size="9">CURRENT STREAK</text>'
              f'<text x="38" y="175" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="52">{current_streak}</text>'
              '<text x="38" y="195" fill="#6d4f57" font-family="monospace" font-size="8">CONSECUTIVE DAYS</text>'

              '<text x="390" y="116" fill="#9d7a82" font-family="monospace" font-size="9">LONGEST STREAK</text>'
              f'<text x="390" y="175" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="52">{longest_streak}</text>'
              '<text x="390" y="195" fill="#6d4f57" font-family="monospace" font-size="8">BEST RUN</text>'

              '<text x="700" y="116" fill="#9d7a82" font-family="monospace" font-size="9">TOTAL CONTRIBUTIONS</text>'
              f'<text x="700" y="175" fill="#ff1744" font-family="monospace" font-weight="bold" font-size="52">{total_contributions}</text>'
              '<text x="700" y="195" fill="#6d4f57" font-family="monospace" font-size="8">LAST 365 DAYS</text>'

              '<line x1="38" y1="218" x2="982" y2="218" stroke="#ff1744" stroke-opacity=".14"/>'
              '<path d="M38 245 H982" stroke="#ff1744" stroke-opacity=".35" fill="none" class="dash"/>'

              '<circle cx="38" cy="274" r="3.5" fill="#ff1744" filter="url(#glow)" class="pulse"/>'
              '<text x="50" y="278" fill="#9d7a82" font-family="monospace" font-size="8">KEEP BUILDING / KEEP LEARNING</text>'
              '<text x="982" y="278" fill="#6d4f57" font-family="monospace" font-size="8" text-anchor="end">AUTO-GENERATED / GITHUB ACTIONS</text>'
          )
          write_svg("streak.svg", 1020, 325, "Contribution streak for dims154", streak)

          max_count = max(
              (day["count"] for day in activity),
              default=1,
          )

          chart_x = 55
          chart_y = 105
          chart_w = 900
          chart_h = 165

          step = chart_w / max(
              1,
              len(activity) - 1,
          )

          points = []

          for index, day in enumerate(activity):
              x = chart_x + index * step

              ratio = (
                  day["count"] / max_count
                  if max_count
                  else 0
              )

              y = (
                  chart_y
                  + chart_h
                  - ratio * chart_h
              )

              points.append((x, y))

          polyline = " ".join(
              f"{x:.1f},{y:.1f}"
              for x, y in points
          )

          circles = "".join(
              f'<circle cx="{x:.1f}" cy="{y:.1f}" r="3.2" '
              'fill="#ffffff" filter="url(#glow)" class="pulse"/>'
              for x, y in points
          )

          def format_date(value):
              return datetime.strptime(
                  value,
                  "%Y-%m-%d",
              ).strftime("%d/%m")

          first_date = (
              format_date(activity[0]["date"])
              if activity
              else ""
          )

          last_date = (
              format_date(activity[-1]["date"])
              if activity
              else ""
          )

          date_ticks = []

          if activity:
              tick_indexes = sorted(
                  set(
                      round(
                          index * (len(activity) - 1) / 4
                      )
                      for index in range(5)
                  )
              )

              for index in tick_indexes:
                  day = activity[index]
                  x = chart_x + index * step
                  label = format_date(day["date"])

                  date_ticks.append(
                      f'<line x1="{x:.1f}" '
                      f'y1="{chart_y + chart_h}" '
                      f'x2="{x:.1f}" '
                      f'y2="{chart_y + chart_h + 9}" '
                      'stroke="#ff1744" stroke-opacity=".55"/>'
                      f'<rect x="{x-25:.1f}" '
                      f'y="{chart_y + chart_h + 11}" '
                      'width="50" height="18" rx="4" '
                      'fill="#050005" fill-opacity=".92" '
                      'stroke="#ff1744" stroke-opacity=".18"/>'
                      f'<text x="{x:.1f}" '
                      f'y="{chart_y + chart_h + 24}" '
                      'fill="#ff6b87" font-family="monospace" '
                      'font-size="10" font-weight="bold" '
                      'text-anchor="middle">'
                      f'{esc(label)}</text>'
                  )

          tick_nodes = "".join(date_ticks)

          recent_total = sum(
              day["count"]
              for day in activity
          )

          activity_body = "".join([
              '<style>',
              '@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}',
              '@keyframes draw{0%{stroke-dashoffset:2200}100%{stroke-dashoffset:0}}',
              '@keyframes scan{0%{transform:translateY(0);opacity:0}15%{opacity:.10}50%{opacity:.18}85%{opacity:.10}100%{transform:translateY(165px);opacity:0}}',
              '@keyframes flow{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-140}}',
              '.pulse{animation:pulse 2s ease-in-out infinite}',
              '.draw{stroke-dasharray:2200;animation:draw 2.6s ease-out forwards}',
              '.scan{animation:scan 5s linear infinite}',
              '.flow{stroke-dasharray:10 10;animation:flow 1.3s linear infinite}',
              '</style>',

              '<rect x="0" y="0" width="1020" height="395" rx="14" fill="#050005" fill-opacity=".72"/>',

              '<text x="38" y="42" class="title red" font-size="22">CONTRIBUTION ACTIVITY</text>',
              '<text x="38" y="64" class="mono muted" font-size="10">LAST 31 DAYS / ACTIVITY MONITOR</text>',

              '<circle cx="944" cy="36" r="7" fill="#ff1744" filter="url(#glow)" class="pulse"/>',
              '<text x="958" y="40" class="mono muted" font-size="10">SYNCED</text>',

              '<line x1="38" y1="82" x2="982" y2="82" stroke="#ff1744" stroke-opacity=".22"/>',
              '<line x1="38" y1="84" x2="982" y2="84" stroke="#ff1744" stroke-opacity=".06" stroke-dasharray="2 8"/>',

              '<rect x="55" y="94" width="900" height="2" fill="#ff1744" fill-opacity=".16" class="scan"/>',

              f'<rect x="{chart_x}" y="{chart_y}" width="{chart_w}" height="{chart_h}" fill="none" stroke="#ff1744" stroke-opacity=".10"/>',
              f'<line x1="{chart_x}" y1="{chart_y + chart_h}" x2="{chart_x + chart_w}" y2="{chart_y + chart_h}" stroke="#ff1744" stroke-opacity=".20"/>',
              f'<line x1="{chart_x}" y1="{chart_y}" x2="{chart_x}" y2="{chart_y + chart_h}" stroke="#ff1744" stroke-opacity=".20"/>',
              f'<line x1="{chart_x}" y1="{chart_y + chart_h / 2}" x2="{chart_x + chart_w}" y2="{chart_y + chart_h / 2}" stroke="#ff1744" stroke-opacity=".07" stroke-dasharray="4 7"/>',

              # Main contribution line.
              f'<polyline points="{polyline}" fill="none" stroke="#ff1744" stroke-width="2.6" filter="url(#glow)" class="draw"/>',

              # Moving dashed line flowing along the chart.
              f'<polyline points="{polyline}" fill="none" stroke="#050005" stroke-opacity=".95" '
              'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="flow"/>',

              circles,
              tick_nodes,

              # Explicit date/month range in dd/mm.
              f'<text x="55" y="304" class="mono muted" font-size="9">WINDOW: {esc(first_date)} → {esc(last_date)}</text>',

              '<line x1="38" y1="326" x2="982" y2="326" stroke="#ff1744" stroke-opacity=".14"/>',

              f'<text x="38" y="346" fill="#ff6b87" font-family="monospace" font-size="11">TOTAL / {recent_total} CONTRIBUTIONS</text>',

              '<circle cx="38" cy="362" r="3.5" fill="#ff1744" filter="url(#glow)" class="pulse"/>',
              '<text x="50" y="366" class="mono muted" font-size="8">GITHUB CONTRIBUTION CALENDAR / AUTO-GENERATED</text>',
              '<text x="982" y="366" class="mono muted" font-size="8" text-anchor="end">SIGNAL: SYNCED</text>',
          ])

          write_svg(
              "contribution-activity.svg",
              1020,
              395,
              "GitHub contribution activity for dims154",
              activity_body,
          )

          print("Generated all profile statistics successfully.")
          PY

      - name: Validate generated files
        run: |
          set -euo pipefail

          required=(
            github-stats.svg
            top-languages.svg
            streak.svg
            contribution-activity.svg
          )

          for file in "${required[@]}"; do
            path="generated-stats/$file"
            test -s "$path"
            grep -q '<svg' "$path"
            grep -q '</svg>' "$path"
            echo "Validated: $path"
          done

      - name: Publish statistics
        run: |
          set -euo pipefail

          cp generated-stats/github-stats.svg stats/github-stats.svg
          cp generated-stats/top-languages.svg stats/top-languages.svg
          cp generated-stats/streak.svg stats/streak.svg
          cp generated-stats/contribution-activity.svg stats/contribution-activity.svg

      - name: Commit changes
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats/*.svg

          if git diff --cached --quiet; then
            echo "No statistics changes detected."
            exit 0
          fi

          git commit -m "chore: update profile statistics"
          git push
