<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="360"
     viewBox="0 0 1200 360">

  <defs>

    <linearGradient id="bg"
                    x1="0" y1="0"
                    x2="1" y2="1">
      <stop offset="0%" stop-color="#050000"/>
      <stop offset="50%" stop-color="#180006"/>
      <stop offset="100%" stop-color="#020000"/>
    </linearGradient>

    <linearGradient id="redLine"
                    x1="0" y1="0"
                    x2="1" y2="0">
      <stop offset="0%" stop-color="#ff003c"/>
      <stop offset="50%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#ff003c"/>
    </linearGradient>

    <filter id="glow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow"
            x="-50%" y="-50%"
            width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32"
            fill="none"
            stroke="#ff003c"
            stroke-opacity="0.10"
            stroke-width="1"/>
    </pattern>

    <pattern id="smallGrid"
             width="8"
             height="8"
             patternUnits="userSpaceOnUse">
      <path d="M 8 0 L 0 0 0 8"
            fill="none"
            stroke="#ff003c"
            stroke-opacity="0.035"
            stroke-width="1"/>
    </pattern>

    <style>
      .title {
        font-family: 'Courier New', monospace;
        font-weight: bold;
      }

      .mono {
        font-family: 'Courier New', monospace;
      }

      .red {
        fill: #ff1744;
      }

      .white {
        fill: #f5f5f5;
      }

      .muted {
        fill: #a37b84;
      }

      .number {
        fill: #ff1744;
        font-weight: bold;
      }

      .card {
        fill: #090306;
        stroke: #ff1744;
        stroke-opacity: 0.22;
        stroke-width: 1;
      }

      .cardGlow {
        fill: none;
        stroke: #ff1744;
        stroke-opacity: 0.08;
        stroke-width: 4;
        filter: url(#softGlow);
        animation: glow 2.8s ease-in-out infinite;
      }

      .bar {
        transform-box: fill-box;
        transform-origin: left center;
        animation: barGlow 2.4s ease-in-out infinite;
      }

      @keyframes barGlow {
        0%, 100% {
          opacity: 0.72;
        }
        50% {
          opacity: 1;
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.35;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes glow {
        0%, 100% {
          opacity: 0.55;
        }

        50% {
          opacity: 1;
        }
      }

      @keyframes scan {
        0% {
          transform: translateY(-150px);
          opacity: 0;
        }

        15% {
          opacity: 0.35;
        }

        50% {
          opacity: 0.12;
        }

        100% {
          transform: translateY(600px);
          opacity: 0;
        }
      }

      @keyframes dash {
        to {
          stroke-dashoffset: -100;
        }
      }

      @keyframes blink {
        0%, 45% {
          opacity: 1;
        }

        50%, 100% {
          opacity: 0.25;
        }
      }

      .pulse {
        animation: pulse 2s ease-in-out infinite;
      }

      .glow {
        animation: glow 2.5s ease-in-out infinite;
      }

      .scan {
        animation: scan 5s linear infinite;
      }

      .dash {
        stroke-dasharray: 8 8;
        animation: dash 2s linear infinite;
      }

      .blink {
        animation: blink 1.5s step-end infinite;
      }
    </style>

  </defs>

  <rect width="100%"
        height="100%"
        rx="14"
        fill="url(#bg)"/>

  <rect width="100%"
        height="100%"
        rx="14"
        fill="url(#smallGrid)"/>

  <rect width="100%"
        height="100%"
        rx="14"
        fill="url(#grid)"/>

  <rect x="4" y="4"
        width="1192"
        height="352"
        rx="12"
        fill="none"
        stroke="#ff003c"
        stroke-width="5"
        opacity="0.15"
        filter="url(#softGlow)"
        class="glow"/>

  <rect x="6" y="6"
        width="1188"
        height="348"
        rx="12"
        fill="none"
        stroke="url(#redLine)"
        stroke-width="1.5"
        filter="url(#glow)"/>

  <rect x="10" y="10"
        width="1180"
        height="2"
        fill="#ff1744"
        opacity="0.2"
        class="scan"/>

  
  <text x="55" y="48"
        class="mono red"
        font-size="13"
        letter-spacing="3">
    SYSTEM / PROFILE / DIMS154
  </text>

  <circle cx="1085" cy="45"
          r="6"
          fill="#ff1744"
          filter="url(#glow)"
          class="blink"/>

  <text x="1105" y="50"
        class="mono muted"
        font-size="11">
    ONLINE
  </text>

  <text x="55" y="125"
        class="title white"
        font-size="42"
        letter-spacing="2">
    MUHAMMAD ILHAM
  </text>

  <text x="58" y="158"
        class="mono red"
        font-size="15"
        letter-spacing="4">
    BACKEND DEVELOPER
  </text>

  <text x="58" y="205"
        class="mono white"
        font-size="13">
    INFORMATION SYSTEMS STUDENT
  </text>

  <text x="58" y="230"
        class="mono muted"
        font-size="11"
        letter-spacing="1">
    SYSTEM DESIGN · ENTERPRISE ARCHITECTURE · AUTOMATION
  </text>

  <path d="M 55 270
           H 310
           L 330 250
           H 470"
        fill="none"
        stroke="#ff1744"
        stroke-width="1"
        opacity="0.6"
        class="dash"/>

  <circle cx="55" cy="270"
          r="4"
          fill="#ff1744"
          filter="url(#glow)"
          class="pulse"/>

  <text x="70" y="275"
        class="mono red"
        font-size="10">
    ONLINE / BUILDING / LEARNING
  </text>

  <path d="M 820 105
           L 930 105
           L 970 145
           H 1135"
        fill="none"
        stroke="#ff1744"
        stroke-width="1"
        opacity="0.18"/>

  <path d="M 850 105
           L 930 55
           L 1000 105"
        fill="none"
        stroke="#ff1744"
        stroke-width="1"
        opacity="0.13"/>

  <circle cx="930" cy="105"
          r="3"
          fill="#ff1744"
          class="pulse"/>

  <line x1="55" y1="315"
        x2="1145" y2="315"
        stroke="#ff1744"
        stroke-opacity="0.35"/>

  <text x="55" y="338"
        class="mono muted"
        font-size="9">
    BACKEND · ARCHITECTURE · DATABASE · AUTOMATION · ANALYTICS
  </text>

  <text x="1050" y="338"
        class="mono red"
        font-size="9">
    v2.0
  </text>


</svg>
