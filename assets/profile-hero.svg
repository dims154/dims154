<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 430"
     width="1200"
     height="430">

<defs>

  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030303"/>
    <stop offset="0.55" stop-color="#100306"/>
    <stop offset="1" stop-color="#180308"/>
  </linearGradient>

  <!-- Main Grid -->
  <pattern id="grid"
           width="60"
           height="60"
           patternUnits="userSpaceOnUse">

    <path d="M60 0H0V60"
          fill="none"
          stroke="#ff1638"
          stroke-opacity=".20"/>

  </pattern>

  <!-- Small Grid -->
  <pattern id="micro"
           width="20"
           height="20"
           patternUnits="userSpaceOnUse">

    <path d="M20 0H0V20"
          fill="none"
          stroke="#ff334d"
          stroke-opacity=".07"/>

  </pattern>

  <!-- Neon Gradient -->
  <linearGradient id="line">

    <stop stop-color="#ff1638"
          stop-opacity=".1"/>

    <stop offset=".5"
          stop-color="#ff4b5f"/>

    <stop offset="1"
          stop-color="#ff1638"
          stop-opacity=".1"/>

  </linearGradient>

  <!-- Glow -->
  <filter id="glow"
          x="-50%"
          y="-50%"
          width="200%"
          height="200%">

    <feGaussianBlur stdDeviation="5"
                    result="blur"/>

    <feMerge>

      <feMergeNode in="blur"/>

      <feMergeNode in="SourceGraphic"/>

    </feMerge>

  </filter>

  <!-- Soft Glow -->
  <filter id="soft"
          x="-50%"
          y="-50%"
          width="200%"
          height="200%">

    <feGaussianBlur stdDeviation="16"/>

  </filter>

  <!-- Clip -->
  <clipPath id="clip">

    <rect x="24"
          y="24"
          width="1152"
          height="382"
          rx="18"/>

  </clipPath>

</defs>


<!-- Background -->

<rect width="1200"
      height="430"
      fill="#000"/>


<rect x="24"
      y="24"
      width="1152"
      height="382"
      rx="18"
      fill="url(#bg)"
      stroke="#ff1638"
      stroke-width="2"
      stroke-opacity=".8"/>


<!-- Animated Environment -->

<g clip-path="url(#clip)">


  <!-- Micro Grid -->

  <rect width="1200"
        height="430"
        fill="url(#micro)">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="20 20"
      dur="8s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Main Grid -->

  <rect width="1200"
        height="430"
        fill="url(#grid)">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="60 60"
      dur="12s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Center Glow -->

  <ellipse cx="600"
           cy="210"
           rx="430"
           ry="130"
           fill="#ff1638"
           opacity=".035"
           filter="url(#soft)">

    <animate
      attributeName="opacity"
      values=".02;.09;.02"
      dur="4s"
      repeatCount="indefinite"/>

  </ellipse>


  <!-- Horizon -->

  <path d="M0 350H1200"
        stroke="#ff1638"
        stroke-opacity=".3"/>


  <!-- Perspective Lines -->

  <path
    d="M120 350L285 70L455 350
       M745 350L920 70L1090 350"
    fill="none"
    stroke="#ff1638"
    stroke-opacity=".13"/>


  <!-- Animated Border -->

  <rect x="24"
        y="24"
        width="1152"
        height="382"
        rx="18"
        fill="none"
        stroke="url(#line)"
        stroke-width="3">

    <animate
      attributeName="stroke-opacity"
      values=".35;1;.35"
      dur="3s"
      repeatCount="indefinite"/>

  </rect>


  <!-- Scanline -->

  <rect x="24"
        y="24"
        width="1152"
        height="3"
        fill="#ff1638"
        opacity=".75">

    <animate
      attributeName="y"
      values="24;403;24"
      dur="6s"
      repeatCount="indefinite"/>

  </rect>

</g>


<!-- TEXT -->

<g font-family="JetBrains Mono,Fira Code,Consolas,monospace">


  <!-- System -->

  <text x="70"
        y="82"
        fill="#ff5267"
        font-size="14"
        letter-spacing="4">

    SYSTEM / PROFILE / DIMS154

  </text>


  <!-- Name -->

  <text x="70"
        y="174"
        fill="#ffffff"
        font-size="48"
        font-weight="700"
        letter-spacing="2">

    MUHAMMAD ILHAM

  </text>


  <!-- Role -->

  <text x="74"
        y="212"
        fill="#ff5267"
        font-size="20"
        letter-spacing="5">

    BACKEND DEVELOPER

  </text>


  <!-- Education -->

  <text x="74"
        y="270"
        fill="#dddddd"
        font-size="16">

    INFORMATION SYSTEMS STUDENT

  </text>


  <!-- Focus -->

  <text x="74"
        y="300"
        fill="#999999"
        font-size="14">

    SYSTEM DESIGN · ENTERPRISE ARCHITECTURE · AUTOMATION

  </text>


  <!-- Status -->

  <circle cx="81"
          cy="340"
          r="5"
          fill="#ff1638"
          filter="url(#glow)">

    <animate
      attributeName="opacity"
      values="1;.25;1"
      dur="1.4s"
      repeatCount="indefinite"/>

  </circle>


  <text x="98"
        y="345"
        fill="#ff5267"
        font-size="13"
        letter-spacing="2">

    ONLINE / BUILDING / LEARNING

  </text>


  <!-- Location -->

  <text x="1000"
        y="76"
        fill="#ff5267"
        font-size="12"
        text-anchor="middle">

    JAMBI

  </text>


  <text x="1000"
        y="98"
        fill="#777777"
        font-size="10"
        text-anchor="middle">

    INDONESIA

  </text>

</g>

</svg>
